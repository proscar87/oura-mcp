# How to start this server from Smithery. It's stdio and local: the token never
# leaves the machine running it.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      ouraSandbox:
        type: boolean
        default: true
        description: >-
          Oura's synthetic data, no credentials. Leave it on to try things out;
          turn it off once you have run `oura-mcp --authorize`.
      ouraPat:
        type: string
        description: >-
          Personal Access Token, only if you already had one: Oura stopped
          issuing them in December 2025. The normal path today is OAuth2 via
          `oura-mcp --authorize`.
  commandFunction: |-
    (config) => ({
      command: 'oura-mcp',
      args: [],
      env: Object.assign(
        {},
        config.ouraSandbox ? { OURA_SANDBOX: '1' } : {},
        config.ouraPat ? { OURA_PAT: config.ouraPat } : {}
      )
    })
