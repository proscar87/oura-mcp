[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# El nombre de DISTRIBUCIÓN es `mcp-oura` porque `oura-mcp` ya está tomado en
# PyPI por un paquete 0.1.0 sin autor ni repositorio. El paquete que se importa
# sigue siendo `oura_mcp`: sólo cambia el nombre con el que se instala.
name = "mcp-oura"
version = "0.1.0"
description = "La API v2 de Oura como servidor MCP, con la paginación bien hecha"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oscar Pacheco" }]
keywords = ["oura", "mcp", "salud", "wearables"]
dependencies = ["mcp>=1.0"]

[project.urls]
Repositorio = "https://github.com/proscar87/oura-mcp"
Problemas = "https://github.com/proscar87/oura-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
oura-mcp = "oura_mcp.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp"]
