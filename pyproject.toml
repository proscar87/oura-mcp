[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The DISTRIBUTION name is `mcp-oura` because `oura-mcp` was already taken on
# PyPI by a 0.1.0 package with no author and no repository. The imported package
# is still `oura_mcp`: only the install name differs.
name = "mcp-oura"
version = "0.3.1"
description = "The Oura v2 API as an MCP server. Paginates, fixes the date range, warns when data is missing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oscar Pacheco" }]
keywords = ["oura", "mcp", "health", "wearables", "sleep"]
dependencies = ["mcp>=1.0"]

[project.urls]
Repository = "https://github.com/proscar87/oura-mcp"
Issues = "https://github.com/proscar87/oura-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
oura-mcp = "oura_mcp.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_mcp"]
