name: Deriva

# APARTE DEL CI OBLIGATORIO, A PROPÓSITO. Este job SÍ sale a internet, y una
# prueba que sale a internet no puede decidir si un PR entra: el día que Oura se
# caiga, o cambie de certificado, o simplemente tarde, el repositorio quedaría
# bloqueado por algo que no está en el diff de nadie.
#
# Por eso corre solo (semanal) o a mano, nunca en push ni en pull_request. Lo que
# vigila es que las 19 colecciones de `colecciones.py` sigan existiendo — contra
# el SANDBOX de Oura, que no pide credenciales, así que tampoco depende del token
# de nadie.

on:
  schedule:
    - cron: "17 6 * * 1"      # lunes, temprano
  workflow_dispatch:

jobs:
  colecciones:
    name: ¿Siguen existiendo las 19?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python tools/check_drift.py
      # El servidor arrancado de verdad, no sus funciones. El modo en que un
      # servidor MCP falla más feo no es devolviendo un dato equivocado: es no
      # completando el handshake, o escribiendo en stdout algo que no sea
      # JSON-RPC. Las dos se ven igual desde el cliente —un servidor que «no
      # aparece»— y ninguna prueba de función las atrapa.
      - run: python tools/smoke_stdio.py
