name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # NODE IS HERE FOR THE PARITY TESTS. They skip themselves without it and
      # without a compiled `ts/dist`, and no workflow installed either — so the
      # `16 skipped` on every job, every push, was the entire differential
      # suite. It never ran once.
      #
      # That suite is the highest-yield technique in this repository: it found
      # the lone carriage return, `rate_limited` missing on one side,
      # milliseconds printed as seconds, a version constant two releases stale.
      # It runs on BOTH interpreters on purpose — the divergence it last caught
      # existed only on 3.10.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm run build
        working-directory: ts
      # No network and no token: the tests never call Oura. A CI that needs
      # someone's PAT to pass isn't a CI, it's a dependency on that person.
      - run: python -m pytest -q

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    # 108 tests that had never run here either. The TypeScript half is what
    # ships in the `.mcpb` — the install path the README puts first — so it was
    # the less tested half of the two, and the one most people actually get.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: npm test
        working-directory: ts

  mcpb:
    name: Bundle
    runs-on: ubuntu-latest
    # `Publish` builds the bundle too now, at tag time. This job is the one
    # that runs on EVERY push, and that is the point: back when nothing else
    # built it at all, two breaks surfaced by hand instead — a `pack` command
    # that 404'd on every machine but the one that already had the tool
    # installed, then a verification step that failed in total silence on the
    # one input it existed to catch. This job is that other machine, and
    # catching it here costs a push rather than a release.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      - run: ./build-mcpb.sh
        working-directory: ts

  docker:
    name: Docker
    runs-on: ubuntu-latest
    # BUILT AND THEN STARTED, like the bundle. An image that builds is not an
    # image that speaks stdio: the container has to be run with `-i` or it has
    # no stdin at all, the handshake never arrives, and from the client that is
    # indistinguishable from a server that does not exist. That is the failure
    # `tools/smoke_stdio.py` exists for, so it is the one thing worth spending
    # a job on — not `docker build` returning 0.
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oura-mcp:ci .
      - name: Does it actually answer over stdio?
        run: |
          salida=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | docker run -i --rm -e OURA_SANDBOX=1 oura-mcp:ci)
          echo "$salida"
          # The three tools by name. Counting them would pass on three wrong
          # ones, and this is the surface every client reads.
          for t in oura_collections oura_query oura_check; do
            echo "$salida" | grep -q "\"$t\"" || {
              echo "::error::the container did not offer $t"
              exit 1
            }
          done
          # Nothing but JSON-RPC on stdout. A stray print breaks the channel and
          # looks, from the client, exactly like a server that never started.
          echo "$salida" | while IFS= read -r linea; do
            [ -z "$linea" ] && continue
            echo "$linea" | python3 -c 'import json,sys; json.loads(sys.stdin.read())' || {
              echo "::error::the container wrote something that is not JSON-RPC: $linea"
              exit 1
            }
          done

  garita:
    name: Garita
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: proscar87/garita@v0
