name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # Sin red y sin token: las pruebas no llaman a Oura. Un CI que necesita el
      # PAT de alguien para pasar no es un CI, es una dependencia de esa persona.
      - run: python -m pytest -q

  garita:
    name: Garita
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: proscar87/garita@v0
