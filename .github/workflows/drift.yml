name: Drift

# SEPARATE FROM THE MANDATORY CI, ON PURPOSE. This job does go out to the
# internet, and a test that goes out to the internet can't decide whether a PR
# lands: the day Oura goes down, or rotates a certificate, or is simply slow, the
# repository would be blocked by something that isn't in anyone's diff.
#
# So it runs on a schedule (weekly) or by hand, never on push or pull_request.
# What it watches is that the 19 collections in `collections.py` still exist —
# against Oura's SANDBOX, which asks for no credentials and therefore doesn't
# depend on anyone's token either.

on:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, early
  workflow_dispatch:

jobs:
  collections:
    name: Do all 19 still exist?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python tools/check_drift.py
      # The server actually started, not its functions. The ugliest way an MCP
      # server fails isn't returning wrong data: it's failing the handshake, or
      # writing something that isn't JSON-RPC to stdout. Both look identical
      # from the client — a server that "doesn't show up" — and no function
      # test catches either.
      - run: python tools/smoke_stdio.py
