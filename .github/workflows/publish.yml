name: Publish

# Fires when a `v*` tag is pushed. Publishing is then:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# WITHOUT A SINGLE SECRET. No PyPI token, no MCP registry token: both
# publications use OIDC, meaning GitHub proves to each service who it is, with a
# single-use credential that lasts minutes and that nobody has to store, rotate
# or look after. A PyPI token in `secrets` would be a permanent key with publish
# rights, living in one more place.
#
# One-time requirement on the PyPI website (Publishing → Add a new pending
# publisher), without generating any token:
#     project   mcp-oura
#     owner     proscar87
#     repo      oura-mcp
#     workflow  publish.yml
#
# THE FILENAME IS PART OF THE IDENTITY. This file was `publicar.yml` when 0.2.0
# was published, and translating the repository renamed it — which silently
# invalidates the trusted publisher, because PyPI matches on the workflow's
# filename. Renaming this file means updating that entry on PyPI first, or the
# upload is rejected as an untrusted publisher.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # to retry the registry without inventing a version

jobs:
  tests:
    name: Tests before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  pypi:
    name: PyPI
    needs: tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the only thing OIDC needs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent on purpose. v0.1.0 was uploaded by hand before this
          # workflow existed; without this, re-tagging it would blow up and
          # take the registry step —which runs after— down with it. A publish
          # flow that only works the first time isn't a flow.
          skip-existing: true

  release:
    name: GitHub release and the .mcpb
    # THE ONE STEP THAT WASN'T HERE, and 0.3.4 nearly shipped without it. Push a
    # tag and PyPI and the registry both moved on their own, while
    # `releases/latest` stayed on the previous version — carrying the exact
    # bundle the release existed to replace. The submission form, the README's
    # install line and the desktop-extension listing all point at
    # `releases/latest`, so for anyone who installs the flagship way, the
    # release had not happened at all.
    #
    # It ran by hand for four releases and worked, which is what made it easy to
    # miss: a manual step only fails on the day someone else runs the release,
    # or the day the person who always did it is looking at something more
    # interesting.
    #
    # Not gated on `pypi`: the bundle embeds its own compiled TypeScript and
    # needs nothing from the index. Gated on `tests` for the same reason every
    # other job is.
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the release and upload the asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci
        working-directory: ts
      # build-mcpb.sh packs the bundle AND then drives the packed artifact
      # through a real handshake, a real tools/call and a resource read. A
      # bundle that builds is not the same as a bundle that runs, and this is
      # the last place that difference can still be caught for free.
      - run: ./build-mcpb.sh
        working-directory: ts
      - name: Release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for THIS version only, never the whole file. Stops at
          # the next `## ` heading.
          awk -v v="$version" '
            $0 ~ "^## " v " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # An empty notes file means the CHANGELOG was not updated, and a
          # release whose notes are blank is worse than one that fails here.
          test -s notes.md || {
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent, for the same reason `skip-existing` is on the PyPI step.
        # v0.3.4's release was created by hand before this job existed, and a
        # re-run of that tag must not fail here and take the rest down with it.
        # If the release already exists the asset is uploaded with --clobber,
        # so re-running always leaves the bundle matching the tag.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; refreshing the bundle"
            gh release upload "$GITHUB_REF_NAME" oura-mcp.mcpb --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              oura-mcp.mcpb
          fi

  ghcr:
    name: Container image
    # Gated on `tests` and not on `pypi`: the image installs from the checkout,
    # not from the index, so it needs nothing that PyPI has to serve first.
    #
    # `ghcr.io` and not Docker Hub, because the credential is the token GitHub
    # already mints for this run. Docker Hub would mean a stored secret, and
    # this workflow's whole shape is that there is not one.
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, start it, and only then push
        run: |
          version="${GITHUB_REF_NAME#v}"
          imagen="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oura-mcp"
          docker build --build-arg "VERSION=$version" \
            -t "$imagen:$version" -t "$imagen:latest" .
          # THE SAME CHECK CI RUNS ON EVERY PUSH, repeated here against the
          # exact bytes about to be published. `docker build` returning 0 says
          # the layers assembled, not that anything speaks stdio — and an image
          # that cannot complete a handshake is worse than a missing one,
          # because it looks installed.
          salida=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"publish","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | docker run -i --rm -e OURA_SANDBOX=1 "$imagen:$version")
          for t in oura_collections oura_query oura_check; do
            echo "$salida" | grep -q "\"$t\"" || {
              echo "::error::the image does not offer $t; not pushing it"
              exit 1
            }
          done
          docker push "$imagen:$version"
          docker push "$imagen:latest"

  registry:
    name: MCP registry
    # Depends on PyPI, and it has to: the registry checks that the EXACT version
    # exists on PyPI before accepting it. Decoupling them as a stopgap created a
    # race — the registry finished in 5 seconds, looked for 0.1.1 and it wasn't
    # there yet. A step that validates against another can't run in parallel
    # with it.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The registry checks that the PyPI package declares this repository before
      # accepting it, so this step goes AFTER publishing to PyPI.
      - name: Install the publisher
        run: |
          # NOT PIPED STRAIGHT INTO TAR. It was, and when the download came back
          # as anything other than a tarball — a 404 page, a rate-limit body, a
          # redirect that didn't resolve — the whole job died with
          #
          #     gzip: stdin: not in gzip format
          #
          # which names neither what was being fetched nor why it failed. It
          # happened once on a release where the URL was provably fine: the
          # transient failure looked identical to a broken URL.
          #
          # Download, check what arrived, retry, and say which it was.
          url="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz"
          for intento in 1 2 3; do
            curl -sSL --retry 3 --retry-delay 5 -o publisher.tgz "$url" && \
              file publisher.tgz | grep -q gzip && break
            echo "attempt $intento: what arrived is not a tarball —" \
                 "$(head -c 120 publisher.tgz | tr -d '\0')"
            sleep 10
          done
          file publisher.tgz | grep -q gzip || {
            echo "::error::could not download mcp-publisher from $url"
            exit 1
          }
          tar xzf publisher.tgz mcp-publisher
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          # PyPI takes a moment to serve a freshly uploaded version through its
          # index, and the registry queries it immediately. That IS retried.
          #
          # What is NOT retried is a validation error. v0.2.0 failed five times in
          # a row over a 106-character description against a 100 cap, and every
          # attempt printed "PyPI may still be propagating": the message sent
          # you to wait for something that was never going to change, and hid
          # the real cause five times over. A retry that can't tell "not yet"
          # from "never like this" turns a clear error into a mystery.
          for i in 1 2 3 4 5; do
            output=$(./mcp-publisher publish 2>&1) && { echo "$output"; exit 0; }
            echo "$output"
            if echo "$output" | grep -q '"status":422'; then
              echo "::error::the registry rejected server.json; waiting will not fix it"
              exit 1
            fi
            echo "attempt $i unsuccessful; PyPI may still be propagating"
            sleep 20
          done
          exit 1
