name: Publish

# Se dispara al empujar una etiqueta `v*`. Publicar es entonces:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# SIN UN SOLO SECRETO. Ni token de PyPI ni token del registro de MCP: las dos
# publicaciones usan OIDC, o sea GitHub le demuestra a cada servicio quién es,
# con una credencial de un solo uso que dura minutos y que nadie tiene que
# guardar, rotar ni cuidar. Un token de PyPI en `secrets` sería una llave
# permanente con permiso de publicar, viviendo en un lugar más.
#
# Requisito de una sola vez, en la web de PyPI (Publishing → Add a new pending
# publisher), sin generar ningún token:
#     proyecto  mcp-oura
#     dueño     proscar87
#     repo      oura-mcp
#     workflow  publicar.yml

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # para volver a intentar el registro sin inventar una versión

jobs:
  tests:
    name: Tests antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  pypi:
    name: PyPI
    needs: pruebas
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # lo único que hace falta para OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotente a propósito. La v0.1.0 se subió a mano antes de que
          # existiera este flujo; sin esto, volver a etiquetarla tronaría y se
          # llevaría por delante el paso del registro, que va después. Un flujo
          # de publicación que sólo funciona la primera vez no es un flujo.
          skip-existing: true

  registry:
    name: MCP registry
    # Depends on PyPI, and it has to: the registry checks that the EXACT version
    # exists on PyPI before accepting it. Decoupling them as a stopgap created a
    # race — the registry finished in 5 seconds, looked for 0.1.1 and it wasn't
    # there yet. A step that validates against another can't run in parallel
    # with it.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The registry checks that the PyPI package declares this repository before
      # accepting it, so this step goes AFTER publishing to PyPI.
      - name: Install the publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          # PyPI takes a moment to serve a freshly uploaded version through its
          # index, and the registry queries it immediately. That IS retried.
          #
          # What is NOT retried is a validation error. v0.2.0 failed five times in
          # a row over a 106-character description against a 100 cap, and every
          # attempt printed "PyPI may still be propagating": the message sent
          # you to wait for something that was never going to change, and hid
          # the real cause five times over. A retry that can't tell "not yet"
          # from "never like this" turns a clear error into a mystery.
          for i in 1 2 3 4 5; do
            salida=$(./mcp-publisher publish 2>&1) && { echo "$salida"; exit 0; }
            echo "$salida"
            if echo "$salida" | grep -q '"status":422'; then
              echo "::error::the registry rejected server.json; waiting will not fix it"
              exit 1
            fi
            echo "attempt $i unsuccessful; PyPI may still be propagating"
            sleep 20
          done
          exit 1
