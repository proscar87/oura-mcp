name: Publicar

# Se dispara al empujar una etiqueta `v*`. Publicar es entonces:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# SIN UN SOLO SECRETO. Ni token de PyPI ni token del registro de MCP: las dos
# publicaciones usan OIDC, o sea GitHub le demuestra a cada servicio quién es,
# con una credencial de un solo uso que dura minutos y que nadie tiene que
# guardar, rotar ni cuidar. Un token de PyPI en `secrets` sería una llave
# permanente con permiso de publicar, viviendo en un lugar más.
#
# Requisito de una sola vez, en la web de PyPI (Publishing → Add a new pending
# publisher), sin generar ningún token:
#     proyecto  mcp-oura
#     dueño     proscar87
#     repo      oura-mcp
#     workflow  publicar.yml

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # para volver a intentar el registro sin inventar una versión

jobs:
  pruebas:
    name: Pruebas antes de publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  pypi:
    name: PyPI
    needs: pruebas
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # lo único que hace falta para OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotente a propósito. La v0.1.0 se subió a mano antes de que
          # existiera este flujo; sin esto, volver a etiquetarla tronaría y se
          # llevaría por delante el paso del registro, que va después. Un flujo
          # de publicación que sólo funciona la primera vez no es un flujo.
          skip-existing: true

  registro:
    name: Registro de MCP
    # Depende de PyPI, y tiene que ser así: el registro comprueba que la VERSIÓN
    # exacta exista en PyPI antes de aceptarla. Lo desacoplé un rato como parche
    # mientras el publicador confiable no estaba configurado, y el resultado fue
    # una carrera — el registro terminó en 5 segundos, buscó la 0.1.1 y todavía
    # no existía. Un paso que valida contra otro no puede correr en paralelo con él.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # El registro comprueba que el paquete de PyPI declare este repositorio
      # antes de aceptarlo, así que este paso va DESPUÉS de publicar en PyPI.
      - name: Instalar el publicador
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Publicar
        run: |
          ./mcp-publisher login github-oidc
          # PyPI tarda un poco en servir una versión recién subida por su índice,
          # y el registro la consulta de inmediato. Se reintenta en vez de fallar.
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "intento $i sin éxito; PyPI puede seguir propagando"
            sleep 20
          done
          exit 1
