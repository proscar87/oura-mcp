# oura-mcp stores no data: it's a pipe between the Oura API and an MCP client.
# The real risk isn't a token in the code — there is none, the credential lives
# in the environment — it's that someone pastes a REAL Oura response as an
# example into the README or a test. A `personal_info` carries email, age,
# weight and height.
#
# No exemptions, and the key is omitted rather than written as an empty list:
# `exenciones: []` trips Garita v0's parser, which reads it as the string "[]".
